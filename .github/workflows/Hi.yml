name: Build Kernel Android 12

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
      - name: Build Kernel
        uses: dabao1955/kernel_build_action@main
        env:
          KCONFIG_ALLCONFIG: "1" # Bí quyết: Ép kernel tự động chọn mặc định, không hỏi
        with:
          kernel-url: https://github.com/kho447520/android_kernel_samsung_exynos7885
          kernel-branch: Hi
          config: a10.config
          arch: arm64
          android-version: 12
          aosp-clang: true
          aosp-clang-version: r383902
          aosp-gcc: true
          anykernel3: false
