name: Build Kernel Android 12

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          repository: kho447520/android_kernel_samsung_exynos7885
          ref: Hi
          fetch-depth: 1

      - name: Setup Config Automatically
        run: |
          # Sử dụng file defconfig gốc của dòng máy (ví dụ exynos7885_defconfig) làm nền
          # Nếu trong thư mục arch/arm64/configs/ có tên khác, bạn hãy sửa lại cho đúng (ví dụ: exynos7885-a10_defconfig)
          make ARCH=arm64 exynos7885_defconfig 
          
          # Áp file a10.config của bạn vào
          scripts/kconfig/merge_config.sh -m .config arch/arm64/configs/a10.config
          
          # Tự động chốt toàn bộ cấu hình mặc định, KHÔNG hỏi bất kỳ câu nào
          make ARCH=arm64 olddefconfig

      - name: Build Kernel
        uses: dabao1955/kernel_build_action@main
        with:
          kernel-url: https://github.com/kho447520/android_kernel_samsung_exynos7885
          kernel-branch: Hi
          # Bỏ tham số config đi, vì chúng ta đã tự cấu hình xong ở bước trên
          arch: arm64
          android-version: 12
          aosp-clang: true
          aosp-clang-version: r383902
          aosp-gcc: true
          anykernel3: false
