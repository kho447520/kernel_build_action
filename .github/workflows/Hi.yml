name: Build Kernel Android 12

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          repository: kho447520/android_kernel_samsung_exynos7885
          ref: Hi
          fetch-depth: 1

      - name: Fix Config and Auto-accept defaults
        run: |
          # 1. Ghi đè giá trị mặc định cho TZDEV_IWI_EVENT (thường là 0 hoặc một số cụ thể)
          # Dùng sed để tìm và thay thế nếu dòng đó đã tồn tại, hoặc thêm mới
          sed -i '/TZDEV_IWI_EVENT/d' arch/arm64/configs/a10.config
          echo "CONFIG_TZDEV_IWI_EVENT=0" >> arch/arm64/configs/a10.config
          
          # 2. Tự động tạo file .config từ a10.config và chọn mặc định cho mọi thứ khác
          make ARCH=arm64 a10.config
          make ARCH=arm64 olddefconfig
          
      - name: Build Kernel
        uses: dabao1955/kernel_build_action@main
        with:
          kernel-url: https://github.com/kho447520/android_kernel_samsung_exynos7885
          kernel-branch: Hi
          config: a10.config  # Action sẽ dùng file config đã được sửa ở bước trên
          arch: arm64
          android-version: 12
          aosp-clang: true
          aosp-clang-version: r383902
          aosp-gcc: true
          anykernel3: false
