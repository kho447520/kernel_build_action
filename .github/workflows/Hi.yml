name: Build Kernel Android 12

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          repository: kho447520/android_kernel_samsung_exynos7885
          ref: Hi
          path: kernel
          fetch-depth: 1

      - name: Setup config for this kernel
        working-directory: kernel
        run: |
          make ARCH=arm64 exynos7885_defconfig
          scripts/kconfig/merge_config.sh -m .config arch/arm64/configs/a10.config
          make ARCH=arm64 olddefconfig

      - name: Build Kernel
        uses: dabao1955/kernel_build_action@main
        with:
          kernel-url: ./kernel/
          config: a10.config
          arch: arm64
          android-version: 12
          aosp-clang: true
          aosp-clang-version: r383902
          aosp-gcc: true
          anykernel3: false
