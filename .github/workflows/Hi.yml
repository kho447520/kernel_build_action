name: Build Kernel Android 17

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          repository: kho447520/android_kernel_samsung_exynos7885
          ref: Hi
          fetch-depth: 1

      - name: Build Kernel
        uses: dabao1955/kernel_build_action@main
        with:
          kernel-url: https://github.com/kho447520/android_kernel_samsung_exynos7885
          kernel-branch: Hi
          config: a10.config
          arch: arm64
          android-version: 17
          aosp-clang: true
          aosp-clang-version: r383902
          aosp-gcc: true
          anykernel3: false
